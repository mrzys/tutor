[package]
name = "tutor-desktop"
version = "0.1.34"
edition = "2024"
rust-version = "1.90"
default-run = "tutor-desktop"

[lib]
name = "tutor_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:webview2-com", "dep:windows"]
custom-protocol = ["tauri/custom-protocol"]
dev-tools = []

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
regex = "1"
pdf-extract = "=0.12.1"
lopdf = "0.42"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "multipart"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
dotenvy = "0.15"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tauri = { version = "=2.12.4", optional = true , features = [] }
tauri-plugin-dialog = { version = "=2.8.3", optional = true }
tauri-plugin-opener = { version = "=2.5.5", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation"] }
windows = { version = "0.62", optional = true }
webview2-com = { version = "=0.39.1", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tutor-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "tutor-desktop-driver"
path = "src/bin/driver.rs"
required-features = ["dev-tools"]

[[bin]]
name = "tutor-bank-maintenance"
path = "src/bin/bank-maintenance.rs"
required-features = ["dev-tools"]

[[bin]]
name = "tutor-vision-trial"
path = "src/bin/vision-trial.rs"
required-features = ["dev-tools"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
