server {
    listen 80;
    listen [::]:80;
    server_name tutor.mrzys.fun;
    return 301 https://tutor.mrzys.fun$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tutor.mrzys.fun;
    ssl_certificate /etc/letsencrypt/live/mrzys.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrzys.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 24m;
    # Draft snapshots include audit evidence; compress JSON before remote transfer.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4319;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_buffering off;
    }
}
